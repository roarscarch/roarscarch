<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Reference architecture: client to gateway, services, Kafka, agents and a vector database">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset="1" stop-color="#080e1c"/>
    </linearGradient>
    <radialGradient id="aglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="agrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#121d30" stroke-width="1" opacity="0.6"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#2f4a72" stroke-width="1"/>
    </marker>
  </defs>

  <rect width="1200" height="340" fill="url(#abg)"/>
  <rect width="1200" height="340" fill="url(#agrid)" opacity="0.5"/>
  <circle cx="600" cy="170" r="420" fill="url(#aglow)" opacity="0.5"/>

  <text x="60" y="56" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#00e5ff" letter-spacing="3">// REFERENCE ARCHITECTURE</text>
  <text x="60" y="92" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#e8f1ff">How I wire systems end to end</text>
  <text x="60" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#6f86a6">request -&gt; decision -&gt; action, observable at every hop</text>

  <g>
    <line x1="171" y1="190" x2="237" y2="190" stroke="#1e2e48" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle r="2.5" fill="#00e5ff">
      <animateMotion path="M171,190 L237,190" dur="2.4s" begin="0.0s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="369" y1="190" x2="435" y2="190" stroke="#1e2e48" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle r="2.5" fill="#8b5cf6">
      <animateMotion path="M369,190 L435,190" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="567" y1="190" x2="633" y2="190" stroke="#1e2e48" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle r="2.5" fill="#00e5ff">
      <animateMotion path="M567,190 L633,190" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="765" y1="190" x2="831" y2="190" stroke="#1e2e48" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle r="2.5" fill="#8b5cf6">
      <animateMotion path="M765,190 L831,190" dur="2.4s" begin="1.2000000000000002s" repeatCount="indefinite"/>

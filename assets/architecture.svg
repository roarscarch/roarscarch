  <g>
    <text x="303" y="143" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9" fill="#42566f" letter-spacing="2">02</text>
    <rect x="237" y="157" width="132" height="66" rx="10" fill="#0a1120" stroke="#16233b"/>

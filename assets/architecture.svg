    <text x="699" y="205" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#6f86a6" letter-spacing="0.3">event bus</text>
    <circle cx="765" cy="157" r="2.5" fill="#8b5cf6" opacity="0">

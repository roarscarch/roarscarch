  </g>
  <g>
    <text x="1095" y="143" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9" fill="#42566f" letter-spacing="2">06</text>
    <rect x="1029" y="157" width="132" height="66" rx="10" fill="#0a1120" stroke="#16233b"/>
    <line x1="1047" y1="157" x2="1143" y2="157" stroke="#8b5cf6" stroke-width="2" opacity="0.85"/>
    <text x="1095" y="187" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#e8f1ff" letter-spacing="0.3">VECTOR DB</text>
    <text x="1095" y="205" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#6f86a6" letter-spacing="0.3">retrieval</text>

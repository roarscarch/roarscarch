  <g>
    <text x="501" y="143" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="9" fill="#42566f" letter-spacing="2">03</text>
    <rect x="435" y="157" width="132" height="66" rx="10" fill="#0a1120" stroke="#16233b"/>
    <line x1="453" y1="157" x2="549" y2="157" stroke="#00e5ff" stroke-width="2" opacity="0.85"/>

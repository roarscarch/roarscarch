    <text x="897" y="205" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#6f86a6" letter-spacing="0.3">langgraph</text>
    <circle cx="963" cy="157" r="2.5" fill="#00e5ff" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2.0s" repeatCount="indefinite"/>

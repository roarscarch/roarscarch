  <line x1="60" y1="262" x2="1140" y2="262" stroke="#16233b" stroke-width="1"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.2">
    <text x="60" y="292" fill="#42566f">DELIVERY</text>
    <text x="146" y="292" fill="#8aa0bd">Docker / Kubernetes / GitHub Actions / AWS</text>
    <text x="618" y="292" fill="#42566f">SIGNALS</text>
    <text x="696" y="292" fill="#8aa0bd">Prometheus / Grafana / OpenTelemetry</text>
    <text x="60" y="314" fill="#42566f">DESIGN</text>

    <text x="303" y="205" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#6f86a6" letter-spacing="0.3">auth / limits</text>
    <circle cx="369" cy="157" r="2.5" fill="#8b5cf6" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>

    <text x="501" y="205" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#6f86a6" letter-spacing="0.3">java / python</text>
    <circle cx="567" cy="157" r="2.5" fill="#00e5ff" opacity="0">

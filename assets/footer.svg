<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Build systems that outlive the hype">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset="0.5" stop-color="#080e1c"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7df3ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="170" fill="url(#fbg)"/>
  <ellipse cx="600" cy="90" rx="420" ry="90" fill="url(#fglow)"/>
  <text x="600" y="52" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#42566f" letter-spacing="5">END OF TRANSMISSION</text>
  <text x="600" y="98" text-anchor="middle" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="700" fill="url(#fg)" letter-spacing="3">BUILD SYSTEMS THAT OUTLIVE THE HYPE</text>
  <line x1="430" y1="122" x2="770" y2="122" stroke="#16233b" stroke-width="1"/>
  <rect x="430" y="121" width="80" height="2" fill="#00e5ff">
    <animate attributeName="x" values="430;690;430" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="146" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#5c7391" letter-spacing="3">ANURAG / SOFTWARE ENGINEER</text>
</svg>
        <tspan fill="#34d399">$</tspan><tspan> ./boot --profile</tspan>
      </text>
      <text x="92" y="366" font-size="12.5">
        <tspan fill="#34d399">&#10003;</tspan><tspan fill="#7d8da6"> identity mounted   </tspan>
        <tspan fill="#34d399">&#10003;</tspan><tspan fill="#7d8da6"> llm runtime online   </tspan>

      <text x="20" y="430">JAVA / SPRING BOOT / PYTHON / FASTAPI / KAFKA / REDIS / POSTGRESQL / KUBERNETES / LANGGRAPH / RAG / DOCKER / AWS / TYPESCRIPT / RUST / LINUX /</text>
      <text x="1220" y="430">JAVA / SPRING BOOT / PYTHON / FASTAPI / KAFKA / REDIS / POSTGRESQL / KUBERNETES / LANGGRAPH / RAG / DOCKER / AWS / TYPESCRIPT / RUST / LINUX /</text>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="34s" repeatCount="indefinite"/>

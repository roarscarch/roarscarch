    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#7d8da6">
      <text x="1078" y="374" text-anchor="end">STATUS <tspan fill="#34d399">&#9679; BUILDING</tspan></text>
      <text x="1078" y="394" text-anchor="end">SIGNAL <tspan fill="#00e5ff">STRONG</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240" role="img" aria-label="REPOGRAPH">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="518" height="238" rx="16" fill="url(#cbg)" stroke="#16233b"/>
  <rect x="1" y="1" width="518" height="238" rx="16" fill="url(#cg)" opacity="0.6"/>
  <rect x="1" y="1" width="4" height="238" rx="2" fill="url(#bar)"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
    <text x="28" y="38" font-size="10.5" fill="#f472b6" letter-spacing="2.5">// DEVELOPER TOOLS</text>
    <text x="492" y="56" text-anchor="end" font-size="44" font-weight="700" fill="#0e1726">#05</text>
    <circle cx="484" cy="33" r="3" fill="#f472b6">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="28" y="94" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#eef6ff" letter-spacing="0.3">REPOGRAPH</text>

  <text x="28" y="123" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#8296b3">Interactive graph of commit history and authorship -</text>
  <text x="28" y="143" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#8296b3">see a codebase like a living, connected network.</text>

  <line x1="28" y1="164" x2="492" y2="164" stroke="#16233b" stroke-width="1"/>
    <rect x="28" y="184" width="96" height="24" rx="12" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="76.0" y="200" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#f472b6" letter-spacing="0.3">TypeScript</text>
    <rect x="133" y="184" width="38" height="24" rx="12" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="152.0" y="200" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#f472b6" letter-spacing="0.3">D3</text>
    <rect x="180" y="184" width="52" height="24" rx="12" fill="#f472b6" fill-opacity="0.08" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="206.0" y="200" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#f472b6" letter-spacing="0.3">Node</text>
  <text x="492" y="201" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#f472b6">-&gt;</text>
</svg>